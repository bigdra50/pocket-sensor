# 開発用のタスク。uv、swift、xcodegen は PATH にあるものを使う。

[tasks.gen]
description = "contract/ から Swift と Python の生成物を作り直す"
run = "uv run --project python python tools/gen_contract.py"

[tasks."gen:check"]
description = "生成物が contract/ と一致しているかを確かめる"
run = "uv run --project python python tools/gen_contract.py --check"

[tasks.vectors]
description = "contract/vectors のテストベクトルを作り直す"
run = "uv run --project python python tools/gen_vectors.py"

[tasks."test:python"]
description = "Python SDK のテスト"
dir = "{{config_root}}/python"
run = "uv run pytest -q"

[tasks."test:swift"]
description = "Swift パッケージのテスト（macOS の上で走る）"
dir = "{{config_root}}/ios/PocketSensorKit"
run = "swift test"

[tasks."lint:python"]
description = "Python の lint と整形の検査"
dir = "{{config_root}}/python"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.test]
description = "生成物の一致、Python、Swift のテストをまとめて走らせる"
depends = ["gen:check", "test:python", "test:swift"]
