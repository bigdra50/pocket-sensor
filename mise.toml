# 開発用のタスク。uv、swift、xcodegen は PATH にあるものを使う。

[tasks.gen]
description = "contract/ から Swift と Python の生成物を作り直す"
run = "uv run --project python python tools/gen_contract.py"

[tasks."gen:check"]
description = "生成物が contract/ と一致しているかを確かめる"
run = "uv run --project python python tools/gen_contract.py --check"

[tasks.vectors]
description = "contract/vectors のテストベクトルを作り直す"
run = "uv run --project python python tools/gen_vectors.py"

[tasks."vectors:check"]
description = "テストベクトルが生成器の出力と一致しているかを確かめる"
run = "uv run --project python python tools/gen_vectors.py --check"

[tasks."test:python"]
description = "Python SDK のテスト（E2E を除く）"
dir = "{{config_root}}/python"
run = "uv run pytest -q"

[tasks."test:swift"]
description = "Swift パッケージのテスト（macOS の上で走る）"
dir = "{{config_root}}/ios/PocketSensorKit"
run = "swift test"

[tasks."test:ios"]
description = "iOS アプリの単体テストをシミュレーターで走らせる（署名は要らない）。機種は POCKETSENSOR_SIMULATOR で変える"
dir = "{{config_root}}/ios/PocketSensor"
run = [
  "xcodegen generate",
  """xcodebuild test -project PocketSensor.xcodeproj -scheme PocketSensor \
    -destination "platform=iOS Simulator,name=${POCKETSENSOR_SIMULATOR:-iPhone 17 Pro}" \
    -derivedDataPath DerivedData-unsigned CODE_SIGNING_ALLOWED=NO -quiet""",
]

[tasks."build:sim"]
description = "Swift の擬似デバイス pocketsensor-sim をビルドする"
dir = "{{config_root}}/ios/PocketSensorKit"
run = "swift build --product pocketsensor-sim"

[tasks."test:e2e"]
description = "Swift の擬似デバイスと Python SDK を通しで確かめる"
depends = ["build:sim"]
dir = "{{config_root}}/python"
run = "uv run pytest -q -m e2e"

[tasks."test:foxglove-client"]
description = "Lichtblick と同じクライアントと復号器で、擬似デバイスの全チャンネルを確かめる（node と npm が要る）"
depends = ["build:sim"]
dir = "{{config_root}}/tools/foxglove-client-check"
run = ["npm ci --no-audit --no-fund --silent", "node check.mjs"]

[tasks."lint:python"]
description = "Python の lint と整形の検査（SDK、ROS 2 の中継、例）"
dir = "{{config_root}}/python"
run = [
  "uv run ruff check . ../ros2 ../examples",
  "uv run ruff format --check . ../ros2 ../examples",
]

[tasks.sim]
description = "擬似デバイスを 8765 番で起動する（Ctrl-C で止める）"
dir = "{{config_root}}/ios/PocketSensorKit"
run = "swift run pocketsensor-sim --port 8765"

[tasks.test]
description = "生成物の一致、Python、Swift、E2E のテストをまとめて走らせる"
depends = ["gen:check", "vectors:check", "test:python", "test:swift", "test:e2e"]
