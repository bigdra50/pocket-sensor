<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>pocketsensor marker</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #fff; color: #111; font: 14px/1.5 -apple-system, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  img { display: block; image-rendering: auto; }
  label { margin-right: 12px; }
  .note { max-width: 640px; color: #444; }
</style>
</head>
<body>
<main>
  <div>
    <label>目印 <select id="marker"><option>marker_a</option><option>marker_b</option></select></label>
    <label>画面の対角（インチ）<input id="diagonal" type="number" step="0.1" value="14.2" style="width:5em"></label>
    <label>画面の横の画素数 <input id="native" type="number" value="3024" style="width:6em"></label>
    <label>縦 <input id="nativeH" type="number" value="1964" style="width:6em"></label>
  </div>
  <img id="image" alt="marker">
  <div class="note" id="info"></div>
  <div class="note">
    アプリに登録してある実寸は、横 15 cm である。
    このページは、画面の対角の長さと画素数から 1 cm あたりの画素数を求めて、15 cm で表示する。
    初期値は 14 インチの MacBook Pro の内蔵ディスプレイの値なので、別の画面で開くときは値を変える。
    定規で測って 15 cm になっていれば、距離も正しく出る。軸の向きを見るだけなら、大きさは多少ずれていてよい。
  </div>
</main>
<script>
  const image = document.getElementById("image");
  const info = document.getElementById("info");
  function layout() {
    const diagonal = Number(document.getElementById("diagonal").value);
    const nativeW = Number(document.getElementById("native").value);
    const nativeH = Number(document.getElementById("nativeH").value);
    const widthInch = diagonal * nativeW / Math.hypot(nativeW, nativeH);
    // screen.width は、OS の拡大率を掛けたあとの CSS の画素数。
    const cssPerCm = screen.width / (widthInch * 2.54);
    const size = Math.round(15 * cssPerCm);
    const name = document.getElementById("marker").value;
    image.src = `../ios/PocketSensor/Assets.xcassets/Anchors.arresourcegroup/${name}.arreferenceimage/${name}.png`;
    image.width = size;
    image.height = size;
    info.textContent = `${name}: ${size} px = 15 cm（1 cm は ${cssPerCm.toFixed(2)} px）。frame は <name>_anchor_${name}`;
  }
  for (const id of ["marker", "diagonal", "native", "nativeH"]) {
    document.getElementById(id).addEventListener("input", layout);
  }
  layout();
</script>
</body>
</html>
