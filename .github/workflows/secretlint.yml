name: secretlint

on:
  push:
    branches: [main]
  pull_request:

# 検査に書き込みは要らない
permissions:
  contents: read

jobs:
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # バージョンの指定を CI と手元で分けないため、mise のタスクをそのまま呼ぶ
      - uses: jdx/mise-action@v4
      - run: mise run lint:secret
