# チャンネルの表。意図の説明は docs/protocol.md にある。
#
# topic と frame_id の <name> は、端末の名前（parameters の device.name）で置き換える。
# encoding はすべて cdr、schemaEncoding はすべて ros2msg なので、表には持たない。
#
# backpressure
#   latest  接続ごとに最新の 1 件だけを持つ。送信中に次が来たら置き換える
#   queue   queue_seconds ぶんまでのキュー。あふれたら古いものから捨てる
#   keep    捨てない
# group
#   同じ値を持つ latest のチャンネルは、同じ ARFrame から作ったメッセージをまとめて置き換える
# latched
#   true なら、購読を受けた直後に最新の 1 件を送る
# rate_param
#   レートの上限を決める parameter の名前。無いものは、センサーが出す間隔か rate_hz の固定値で流す
# stage
#   1 は最初の段階、2 は次の段階（docs/protocol.md の「次の段階で足すチャンネル」）

[[channel]]
key = "odom"
topic = "/<name>/odom"
schema = "nav_msgs/msg/Odometry"
frame_id = "<name>_odom"
child_frame_id = "<name>_link"
rate_param = "pose.rate"
backpressure = "latest"
group = "arframe"
latched = false
stage = 1

[[channel]]
key = "tracking"
topic = "/<name>/tracking"
schema = "pocketsensor_msgs/msg/TrackingStatus"
frame_id = "<name>_link"
rate_param = "pose.rate"
backpressure = "latest"
group = "arframe"
latched = false
stage = 1

[[channel]]
key = "tf"
topic = "/tf"
schema = "tf2_msgs/msg/TFMessage"
frame_id = "<name>_odom"
child_frame_id = "<name>_link"
rate_param = "pose.rate"
backpressure = "latest"
group = "arframe"
latched = false
stage = 1

[[channel]]
key = "tf_static"
topic = "/tf_static"
schema = "tf2_msgs/msg/TFMessage"
frame_id = "<name>_link"
backpressure = "keep"
latched = true
stage = 1

