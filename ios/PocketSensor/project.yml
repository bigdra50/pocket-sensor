# XcodeGen の定義。`xcodegen generate` で PocketSensor.xcodeproj を作る（生成物は git 管理外）。
# 署名に使うチームはここへ書かない。チーム ID は開発者ごとに違い、リポジトリへ残す値ではないためである。
# 実機へ入れるときは、このディレクトリに Local.xcconfig（git 管理外）を作って次の 1 行を書く。
#   DEVELOPMENT_TEAM = <自分のチーム ID>
# Local.xcconfig が無くても generate と署名なしのビルドは通る。
name: PocketSensor
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
options:
  bundleIdPrefix: io.github.bigdra50
  # Local.xcconfig は任意なので、無いことを generate のエラーにしない
  disabledValidations:
    - missingConfigFiles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 6 の厳格な並行性検査は骨格の段階では入れない。ARKit と Core Motion の callback が
    # それぞれのキューで呼ばれる構造を先に固め、検査は実装が落ち着いてから上げる
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PocketSensorKit:
    path: ../PocketSensorKit
targets:
  PocketSensor:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: Assets.xcassets
    dependencies:
      - package: PocketSensorKit
        product: PocketSensorCore
      - package: PocketSensorKit
        product: PocketSensorServer
      - package: PocketSensorKit
        product: PocketSensorMedia
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PocketSensor
        CFBundleShortVersionString: "0.1.0"
        NSCameraUsageDescription: ARKit で姿勢と深度を取るためにカメラを使います
        NSLocalNetworkUsageDescription: ロボットへセンサーデータを送るために LAN からの接続を受け付けます
        NSMotionUsageDescription: 加速度、角速度、姿勢、気圧を取るためにモーションセンサーを使います
        NSLocationWhenInUseUsageDescription: GNSS の測位解を取るために位置情報を使います
        NSBonjourServices:
          - _pocketsensor._tcp
        UIRequiredDeviceCapabilities:
          - arkit
          - arm64
        # 台車への取り付けを横置きと縦置きで比べるので、縦も許す。上下逆の縦は入れない。
        # Face ID の iPhone は、画面を上下逆の縦へ回さない
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bigdra50.pocketsensor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
  PocketSensorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PocketSensor
      - package: PocketSensorKit
        product: PocketSensorCore
    settings:
      base:
        # テストバンドルは Info.plist を持たないので自動生成させる。無いと署名段階で
        # 「target does not have an Info.plist」で止まり、テストが走らない
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bigdra50.pocketsensor.tests
schemes:
  PocketSensor:
    build:
      targets:
        PocketSensor: all
        PocketSensorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PocketSensorTests
