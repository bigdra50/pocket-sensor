[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketsensor"
version = "0.1.0"
description = "Receiver SDK for pocketsensor"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "websockets>=13",
    "rosbags>=0.10",
    "mcap>=1.2",
]

[project.optional-dependencies]
jpeg = ["pillow>=10"]
discovery = ["zeroconf>=0.130"]
video = ["av>=12"]

[project.scripts]
pocketsensor = "pocketsensor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pillow>=10",
    "foxglove-sdk>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pocketsensor"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/pocketsensor/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
